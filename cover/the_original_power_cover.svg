<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" viewBox="0 0 1200 1600" width="1200" height="1600"
     style="--bg:#0d1b2a;--ink:#e8c99b;--accent:#e08a3c;--dim:#8a6a45">
<sodipodi:namedview inkscape:document-units="px" pagecolor="#0d1b2a"/>
<title>The Original Power — cover</title>
<defs>
  <style><![CDATA[
    :root { }
    .wire   { fill:none; stroke:var(--ink); stroke-width:3.2;
               stroke-linecap:round; stroke-linejoin:round; }
    .wire-thin { fill:none; stroke:var(--ink); stroke-width:2.2;
               stroke-linecap:round; }
    .fill-ink  { fill:var(--ink); stroke:none; }
    .no-fill   { fill:none; }
    .chart     { fill:none; stroke:var(--dim); stroke-width:1.6; }
    .chart-rim { fill:none; stroke:var(--ink); stroke-width:3; }
    .accent    { stroke:var(--accent); fill:none; stroke-width:3.4; }
    .accent-fill { fill:var(--accent); stroke:none; }
    .label     { fill:var(--ink); font-family:'Courier New',monospace;
                  font-size:17px; }
    .label-sm  { fill:var(--dim); font-family:'Courier New',monospace;
                  font-size:14px; }
  ]]></style>

  <!-- inductor: 4 loops, 82 long -->
  <symbol id="s-coil" overflow="visible"><path class="wire" d="M 0 0 a 9 9 0 0 1 18 0 a 9 9 0 0 1 18 0 a 9 9 0 0 1 18 0 a 9 9 0 0 1 18 0 l 10 0"/></symbol>
  <symbol id="s-res"  overflow="visible"><path class="wire" d="M 0 0 l 8 0 l 5 -11 l 5 11 l 5 -11 l 5 11 l 5 -11 l 5 11 l 8 0"/></symbol>
  <symbol id="s-cap"  overflow="visible">
    <path class="wire" d="M 0 0 l 12 0 M 12 -17 l 0 34 M 26 -17 l 0 34 M 26 0 l 12 0"/>
  </symbol>
  <symbol id="s-junction" overflow="visible">
    <circle class="wire no-fill" cx="0" cy="0" r="6"/>
  </symbol>
  <symbol id="s-arrow" overflow="visible">
    <path class="fill-ink" d="M -11 0 L 11 0 L 0 26 Z"/>
  </symbol>
  <!-- transformer: two magnetically coupled windings, galvanically ISOLATED.
       Primary along y=0, secondary along y=34, core bars between. The two sides
       of the border are coupled here, never electrically joined. -->
  <symbol id="s-xfmr" overflow="visible">
    <path class="wire" d="M 0 0 a 9 9 0 0 1 18 0 a 9 9 0 0 1 18 0 a 9 9 0 0 1 18 0 a 9 9 0 0 1 18 0 l 10 0"/>
    <g transform="translate(0,34) scale(1,-1)"><path class="wire" d="M 0 0 a 9 9 0 0 1 18 0 a 9 9 0 0 1 18 0 a 9 9 0 0 1 18 0 a 9 9 0 0 1 18 0 l 10 0"/></g>
    <path class="wire" d="M 4 13 l 74 0 M 4 21 l 74 0"/>
  </symbol>
  <!-- ground: stacked rules, narrowing downward -->
  <symbol id="s-ground" overflow="visible">
    <path class="wire" d="M -34 0 l 68 0 M -24 9 l 48 0 M -14 18 l 28 0 M -6 27 l 12 0"/>
  </symbol>
</defs>

