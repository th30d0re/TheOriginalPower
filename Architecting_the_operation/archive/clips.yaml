  atwater_1981:
    citation: 'Perlstein, R. (2012, November 13). Exclusive: Lee Atwater''s infamous
      1981 interview on the Southern Strategy. The Nation. Interview conducted by
      Alexander P. Lamis, 1981; audio released by Renee Lamis and James Carter IV.'
