# Post-mix for chapter135_reply. Applied by scriptcast-mix to the stitched MP3.
overlays:
  # Emmanuel, very quietly under "sixty-nine days".
  - file: Architecting_the_operation/archive/sources/nice.wav
    turn_contains: "sixty-nine days after she signed"
    after_word: "^(69|sixtynine)$"
    delay_ms: 80
    gain_db: -11
gains:
  # The reel-closing "Interesting." should land louder.
  - turn_equals: "Interesting."
    gain_db: 6
  # "the opposite of empty: grandfather clause" was too soft.
  - turn_contains: "the opposite of empty"
    gain_db: 4
  # "and it's empty in that sentence" was too soft.
  - turn_contains: "it's empty in that sentence"
    gain_db: 5
