# Spellings handed to text-reading TTS engines (OmniVoice, Chatterbox) so a
# heteronym comes out in the reading its context calls for.
#
#   word:
#     <misaki reading key>: <spelling sent to the engine>
#
# The reading key is whichever key misaki's lexicon uses for that reading
# ("default", "verb", "noun", "adj", "vbd", ...). `find_heteronyms` in
# pronunciation.py reports it for any sentence.
#
# Add an entry only after calibrating it:
#   scriptcast-calibrate record --reading default \
#       --candidates reckerd,RECK-erd --takes 6
# The script, captions and verification always keep the real word.

record:
  default: reckerd   # the noun, REC-ord
  verb: ree-CORD

# The metal. Misaki's lexicon lists "lead" only as LEED, so no reading key
# reaches it; "always" respells it in every context (this script never uses the verb).
lead:
  always: led

# ATF Form 4473, said "forty-four seventy-three".
"4473":
  always: forty-four seventy-three

# The FID card is spelled out: F, I, D.
fid:
  always: eff eye dee

# Greek rho, the demographic weight. The lexicon reading is the English word "row".
rho:
  always: roe

# Boston City Councilor Ruthzee Louijeune (Haitian, French-derived surname).
# Chosen by ear against her own pronunciation (2026-10-14; surname from round 3, take 4).
ruthzee:
  always: Roothzee
louijeune:
  always: Loo-wee-zhen

# Arline Geronimus (weathering research): jer-AH-nih-mus. Added 2026-10-18 for YT02v2 turn 422 ("gyranomus").
geronimus:
  always: jer-AH-nih-mus
  phonon: ""   # Phonon spells the capitals out; it reads the plain name right

# "decile" was coming out as "decel" (YT02v2 turn 415).
decile:
  always: DESS-ile
geronimus's:
  always: jer-AH-nih-mus's
  phonon: ""

# Phonon 31m readings of the complex-wage and dashboard symbols, calibrated
# 2026-10-23 (two takes each, heard back with mlx-whisper small). A hyphenated
# key matches the whole compound. No "always", so other engines are unchanged.
psi-sub-m:
  phonon: sigh sub em     # plain: "peace of them"
psi-sub-s:
  phonon: sigh sub ess    # plain: "P sub sub S"
psi:
  phonon: sigh            # "psi of t"; plain: "PFC"
phi-load:
  phonon: fie load        # plain: "phylode"
rho-tau:
  phonon: row-tao         # plain: "row-top"; "roe-tau": "road talk"
