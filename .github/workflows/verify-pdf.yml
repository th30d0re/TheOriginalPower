name: Compile manuscript

# Compiles Paper/The_Original_Power.tex and fails on a real LaTeX error or an
# unresolved cross-reference / citation. It does NOT compare PDF bytes: a
# byte-identical rebuild only holds on the exact local TeX Live, and this runner
# uses a different distribution. Byte-stable verification is `make verify-pdf`,
# run locally before committing a regenerated PDF (see AGENTS.md, Release Policy).

"on":
  pull_request:
    paths:
      - "Makefile"
      - "Paper/**/*.tex"
      - "Paper/**/*.bib"
      - "Paper/**/*.sty"
      - "Paper/figures/**"
      - ".github/workflows/verify-pdf.yml"
  push:
    paths:
      - "Makefile"
      - "Paper/**/*.tex"
      - "Paper/**/*.bib"
      - "Paper/**/*.sty"
      - "Paper/figures/**"
      - ".github/workflows/verify-pdf.yml"

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            biber \
            cm-super \
            latexmk \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures

      - name: Compile and check for errors and unresolved references
        run: make check-tex
