# scriptCast project settings for the Architecting the Operation podcast.
# scriptCast is its own repository (../scriptCast). Paths are relative to this
# file, so scriptcast commands work from anywhere inside this repo.

voices           = "Architecting_the_operation/scriptcast/voices.phonon.yaml"
pronunciations   = "Architecting_the_operation/scriptcast/pronunciations.yaml"
speaker_rates    = "Architecting_the_operation/scriptcast/speaker_rates.json"
clips            = "Architecting_the_operation/archive/clips.yaml"
clip_sources     = "Architecting_the_operation/archive/sources"
references       = "voices/candidates"
scripts          = "Architecting_the_operation/podcasts"
outputs          = "outputs"
omnivoice_python = ".venv-omnivoice/bin/python"
tail_ms          = 800   # keep the decay of each turn's last word (was clipping "now", "clause")

[youtube]
shots = "Architecting_the_operation/video/YT02v2_shotlist.md"

[youtube.by_episode]
YT02v2_ov = "Architecting_the_operation/video/YT02v2_ov_shotlist.md"
